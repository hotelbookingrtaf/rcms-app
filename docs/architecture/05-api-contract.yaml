openapi: 3.1.0
info:
  title: RCMS API
  version: 1.3.0-draft
  description: Server-side command/query contract derived from RCMS Data State Pack v1.3
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/session:
    post:
      security: []
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "200": { description: Authenticated }
        "401": { $ref: "#/components/responses/Problem" }
  /tenants:
    get:
      operationId: listTenants
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Tenant page }
    post:
      operationId: createTenant
      x-required-permission: TENANT.CREATE
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { description: Created }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenantId}/sites:
    post:
      operationId: createSite
      x-required-permission: SITE.CREATE
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Created }
  /sites/{siteId}/services:
    post:
      operationId: createServiceAccount
      x-required-permission: SERVICE.CREATE
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, startDate]
              properties:
                serviceType: { $ref: "#/components/schemas/ServiceType" }
                startDate: { type: string, format: date }
      responses:
        "201": { description: Created }
  /imports/readings:
    post:
      operationId: createReadingImport
      x-required-permission: READING.IMPORT
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, serviceType, sourceSystem, sourceDataVersion, templateVersion]
              properties:
                file: { type: string, format: binary }
                serviceType: { $ref: "#/components/schemas/ServiceType" }
                sourceSystem: { type: string }
                sourceDataVersion: { type: string }
                templateVersion: { type: string }
      responses:
        "202":
          description: Batch accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /imports/{batchId}/commit:
    post:
      operationId: commitImportBatch
      x-required-permission: READING.VALIDATE
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [ALL_OR_NOTHING, VALID_ROWS_ONLY] }
      responses:
        "200": { description: Committed or committed with errors }
        "409": { $ref: "#/components/responses/Problem" }
  /exceptions:
    get:
      operationId: listExceptions
      parameters:
        - { name: risk, in: query, schema: { type: string, enum: [GREEN, YELLOW, RED] } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] },
          }
      responses:
        "200": { description: Exception queue }
  /exceptions/{exceptionId}/resolve:
    post:
      operationId: resolveException
      x-required-permission: EXCEPTION.RESOLVE
      parameters:
        - { name: exceptionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionSource, reason]
              properties:
                decisionSource: { type: string, enum: [RULE, MANUAL] }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Resolved with provenance }
  /billing-runs:
    post:
      operationId: createBillingRun
      x-required-permission: BILLING.ISSUE
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billingPeriodId, sourceDataVersion]
              properties:
                billingPeriodId: { type: string, pattern: '^\\d{4}-\\d{2}$' }
                sourceDataVersion: { type: string }
      responses:
        "202": { description: Billing run started }
        "409": { $ref: "#/components/responses/Problem" }
  /statements/{statementId}:
    get:
      operationId: getStatement
      description: Presentation grouping only; financial invoices remain service-specific.
      parameters: [{ name: statementId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Statement with electricity/water invoices }
  /payment-intents:
    post:
      operationId: createPaymentIntent
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, siteId, serviceAccountId, targetInvoiceIds]
              properties:
                tenantId: { type: string }
                siteId: { type: string }
                serviceAccountId: { type: string }
                targetInvoiceIds: { type: array, minItems: 1, items: { type: string } }
      responses:
        "201": { description: Intent created }
        "422": { $ref: "#/components/responses/Problem" }
  /payments:
    post:
      operationId: receivePayment
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { description: Payment received, not yet verified }
        "409": { $ref: "#/components/responses/Problem" }
  /payments/{paymentId}/verify:
    post:
      operationId: verifyPayment
      x-required-permission: PAYMENT.VERIFY
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Verified, allocated and reconciled transactionally }
        "409": { $ref: "#/components/responses/Problem" }
  /payments/{paymentId}/reverse:
    post:
      operationId: reversePayment
      x-required-permission: PAYMENT.REVERSE
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, effectiveAt]
              properties:
                reason: { type: string }
                effectiveAt: { type: string, format: date-time }
      responses:
        "200": { description: Reversal chain created; original events retained }
  /service-accounts/{serviceAccountId}/disconnection-requests:
    post:
      operationId: requestDisconnection
      x-required-permission: DISCONNECTION.CREATE
      parameters:
        - { name: serviceAccountId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Pending supervisor approval }
        "422": { $ref: "#/components/responses/Problem" }
  /disconnection-requests/{requestId}/decision:
    post:
      operationId: decideDisconnection
      x-required-role: SUPERVISOR
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Approved/rejected; approved request creates work order }
  /work-orders/{workOrderId}/complete:
    post:
      operationId: completeWorkOrder
      x-required-role: UTILITY_FIELD_OFFICER
      parameters:
        - { name: workOrderId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveAt, evidenceRefs]
              properties:
                effectiveAt: { type: string, format: date-time }
                evidenceRefs: { type: array, minItems: 1, items: { type: string } }
      responses:
        "200": { description: Completed and service state updated transactionally }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rcms_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ServiceType:
      type: string
      enum: [ELECTRICITY, WATER]
    ImportBatch:
      type: object
      required: [importBatchId, status, rowCount, validCount, errorCount, warningCount]
      properties:
        importBatchId: { type: string }
        status:
          {
            type: string,
            enum: [RECEIVED, VALIDATING, COMMITTED, COMMITTED_WITH_ERRORS, REJECTED, SUPERSEDED],
          }
        rowCount: { type: integer, minimum: 0 }
        validCount: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
