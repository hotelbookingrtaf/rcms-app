services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rcms
      POSTGRES_USER: rcms
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rcms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcms -d rcms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rcms_postgres:
